[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-caption-tool"
version = "0.1.1"
description = "Local Windows caption editor for character and style LoRA datasets"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "Pillow>=11,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["PyInstaller==6.21.0"]

[project.gui-scripts]
simple-caption-tool = "captioner.gui:main"

[tool.setuptools.package-data]
captioner = ["catalog.json", "icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
